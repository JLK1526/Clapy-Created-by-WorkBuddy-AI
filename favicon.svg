<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Clap game icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4fd0"/>
      <stop offset=".48" stop-color="#41368a"/>
      <stop offset="1" stop-color="#94486d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".24" cy=".16" r=".92">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="120" y2="420">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe2ef"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- 左手：掌心朝右 -->
    <g fill="url(#skin)">
      <rect x="88" y="228" width="126" height="178" rx="56"/>
      <rect x="92" y="170" width="28" height="104" rx="14"/>
      <rect x="122" y="142" width="28" height="132" rx="14"/>
      <rect x="152" y="136" width="28" height="138" rx="14"/>
      <rect x="182" y="152" width="28" height="122" rx="14"/>
      <rect x="0" y="0" width="30" height="92" rx="15" transform="translate(200 270) rotate(-28)"/>
    </g>

    <!-- 右手：左手水平镜像 -->
    <g fill="url(#skin)" transform="translate(512 0) scale(-1 1)">
      <rect x="88" y="228" width="126" height="178" rx="56"/>
      <rect x="92" y="170" width="28" height="104" rx="14"/>
      <rect x="122" y="142" width="28" height="132" rx="14"/>
      <rect x="152" y="136" width="28" height="138" rx="14"/>
      <rect x="182" y="152" width="28" height="122" rx="14"/>
      <rect x="0" y="0" width="30" height="92" rx="15" transform="translate(200 270) rotate(-28)"/>
    </g>

    <!-- 指缝 -->
    <g stroke="#41368a" stroke-opacity=".42" stroke-width="8" stroke-linecap="round">
      <path d="M121 168V246 M151 156V246 M181 158V246"/>
      <path d="M391 168V246 M361 156V246 M331 158V246"/>
    </g>

    <!-- 拍击火花：四芒星 + 两点 -->
    <g fill="#ffd9a0">
      <path d="M256 130 Q263 163 296 170 Q263 177 256 210 Q249 177 216 170 Q249 163 256 130 Z"/>
      <circle cx="212" cy="214" r="7"/>
      <circle cx="300" cy="214" r="7"/>
    </g>
  </g>
</svg>
